<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>飲食紀錄</title>
<meta name="description" content="記錄每餐熱量與三大營養素的個人飲食紀錄工具。" />
<meta name="theme-color" content="#FAF7F0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="飲食紀錄" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FAF7F0;
    -webkit-text-size-adjust: 100%;
  }
  /* Keeps the bottom tab bar reachable on mobile browsers with a collapsing UI bar. */
  html { height: -webkit-fill-available; }
  body { min-height: 100vh; min-height: -webkit-fill-available; }
  #boot {
    font-family: ui-sans-serif, system-ui, sans-serif;
    color: #8A8578;
    font-size: 14px;
    text-align: center;
    padding: 80px 20px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="root"><div id="boot">載入中…</div></div>

<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/supabase.js"></script>

<script>
  // Without this the page would sit on "載入中…" with no explanation if a file failed
  // to load or the app threw while starting up.
  window.addEventListener("error", function (e) {
    var boot = document.getElementById("boot");
    if (boot && document.getElementById("root").contains(boot)) {
      boot.textContent = "載入失敗：" + (e && e.message ? e.message : "未知錯誤") + "。請重新整理，若持續發生請回報。";
    }
  });
</script>

<script src="app.js"></script>
</body>
</html>
